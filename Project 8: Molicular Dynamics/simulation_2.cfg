# =============================================================================
# Molecular Dynamics Simulation Configuration File
# =============================================================================
# Format: key=value
#   - Lines starting with '#' are comments and are ignored.
#   - Empty lines are ignored.
#   - There must be NO spaces around the '=' sign.
#   - All units are in reduced Lennard-Jones units (sigma=1, epsilon=1, mass=1).
#
# Usage:
#   Build the project with make, then run:
#       ./bin/md_sim simulation.cfg
#
# The output will be saved automatically to ./output/out_N/ where N is an
# incrementing integer. Each output directory contains:
#   positions.npy        — particle trajectories (sampled every 10 steps)
#   temperatures.npy     — temperature at each time step
#   potentialEnergies.npy
#   kineticEnergies.npy
#   totalEnergies.npy
#   metadata.npy         — [width, height, numParticles, timeSteps, finalTime]
#   energy_data_N.csv    — full energy time-series
#   positions_data_N.csv — full position time-series
# =============================================================================


# -----------------------------------------------------------------------------
# TIME PARAMETERS
# -----------------------------------------------------------------------------
#   Example: timeSteps=10000, finalTime=50.0  →  dt = 0.005 (stable)
# -----------------------------------------------------------------------------
# int
# float
timeSteps=500000
finalTime=1000.0


# -----------------------------------------------------------------------------
# SIMULATION BOX SIZE
# -----------------------------------------------------------------------------
# width, height: Dimensions of the 2D simulation box in units of sigma.
#   Particles that leave the box are handled by the boundary conditions below.
#   Make the box large enough that the initial particle arrangement fits inside.
# -----------------------------------------------------------------------------
# float
# float
width=250.0
height=250.0


# -----------------------------------------------------------------------------
# BOUNDARY CONDITIONS
# -----------------------------------------------------------------------------
# xBoundaryCondition, yBoundaryCondition: The boundary condition applied to
#   each wall of the simulation box independently.
# -----------------------------------------------------------------------------
# string ("periodic" or "reflective")
# string ("periodic" or "reflective")
xBoundaryCondition=periodic
yBoundaryCondition=reflective


# -----------------------------------------------------------------------------
# GRAVITY
# -----------------------------------------------------------------------------
# gravity: Strength of a constant downward acceleration applied to every
#   particle (acts in the -y direction).
#   Set to 0.0 to disable gravity entirely.
#   In reduced units, a value of ~0.01–0.05 produces visible gravitational
#   settling without immediately forcing all particles to the floor.
# -----------------------------------------------------------------------------
# float
gravity=0.05


# -----------------------------------------------------------------------------
# INITIAL PARTICLE POSITIONS
# -----------------------------------------------------------------------------
# initialPositionsInstructions: Defines where particles start at t=0.
#
# FORMAT:
#   A semicolon (;) separated list of shape instructions. Each instruction is
#   a comma-separated list of parameters. Multiple shapes can be combined —
#   their particle sets are merged into the initial configuration.
#
# AVAILABLE SHAPES AND THEIR PARAMETERS:
#
#   Rectangle,centerX,centerY,rotation,spacing,numParticlesX,numParticlesY
#       Creates a rectangular grid of particles.
#       numParticlesX — number of columns
#       numParticlesY — number of rows
#
#   Hexagon,centerX,centerY,rotation,spacing,size
#       Hexagonal close-packed lattice shaped like a regular hexagon.
#       size — number of rings around the centre (size=3 → ~37 particles)
#
#   Rhombus,centerX,centerY,rotation,spacing,size
#       Same hex lattice but shaped like a rhombus/parallelogram.
#       size — half-edge length in lattice units
#
#   Triangle,centerX,centerY,rotation,spacing,size
#       Hex lattice trimmed to a filled equilateral triangle.
#       size — side length in lattice units
#
#   Circle,centerX,centerY,rotation,spacing,size
#       Hex lattice trimmed to a filled circle.
#       size — radius in units of spacing
#
# PARAMETER MEANINGS:
#   centerX, centerY — position of the shape centre in box coordinates
#   rotation         — rotation of the lattice in RADIANS (0 = no rotation)
#   spacing          — distance between nearest-neighbour particles (sigma units)
#                      Use ~1.0–1.12 for a near-equilibrium LJ solid.
#                      Values < 1.0 cause very large repulsive forces at startup.
#   size             — see per-shape description above
#
# EXAMPLES (uncomment one group at a time):
#
#   Single hexagon cluster in the centre of the box:
#     initialPositionsInstructions=Hexagon,25.0,25.0,0.0,1.1,8
#
#   Two circles that will collide:
#     initialPositionsInstructions=Circle,15.0,25.0,0.0,1.1,5;Circle,35.0,25.0,0.0,1.1,5
#
#   A triangle on top of a rectangle (multi-shape):
#     initialPositionsInstructions=Triangle,25.0,35.0,0.0,1.1,5;Rectangle,25.0,15.0,0.0,1.1,10,5
#
#
# -----------------------------------------------------------------------------
# string (see format description above),
# float (x ctr), float (y ctr), float (rotation in radians), float (spacing),
# int (size), int (size)
initialPositionsInstructions=Rectangle, 125.0, 60.0, 0.0, 1.1, 100, 100


# -----------------------------------------------------------------------------
# ENERGY SCHEDULE (HEATING / COOLING)
# -----------------------------------------------------------------------------
# EnergyInstructions: A schedule of kinetic energy injections or removals
#   applied throughout the simulation. This is how you heat or cool the system
#   without an external thermostat — velocities are rescaled each step.
#
# FORMAT:
#   A semicolon (;) separated list of instructions, each with THREE values:
#
#     startPercent,endPercent,totalEnergyChangePer100Particles
#
#   startPercent  — when this segment begins (0–100 % of total time steps)
#   endPercent    — when this segment ends   (0–100 % of total time steps)
#   totalEnergyChangePer100Particles
#                 — total kinetic energy (in reduced units) added (+) or
#                   removed (−) per 100 particles over the whole segment.
#                   The change is spread uniformly across the time steps in
#                   [startPercent, endPercent]. Scales automatically with the
#                   actual particle count.
#
# DESIGN GUIDE:
#   • Start with 0 energy (no instructions, or all changes = 0) to let the
#     system equilibrate from rest.
#   • Add a gentle heating phase (e.g. +5 per 100 particles over 10–30 % of
#     the run) to bring the system to a target temperature.
#   • Follow with a hold phase (no energy change) to observe equilibrium.
#   • Optionally cool the system to study solidification.
#
# EXAMPLES:
#
#   No energy change (system runs at initial KE only):
#     EnergyInstructions=0,0,0
#
#   Heat from 10 % → 40 % of the run, then cool from 60 % → 90 %:
#     EnergyInstructions=10,40,10.0;60,90,-10.0
#
#   Rapid heat spike at the start, then slow cool to end:
#     EnergyInstructions=0,10,20.0;20,100,-15.0
#
# CURRENT SETTING:
#   Gently heat the system from 15 %–40 % of the simulation (bring solid to
#   liquid-like state), then hold, then slowly cool from 40 %–95 %.
# -----------------------------------------------------------------------------
# int (start %), int (end %), float (energy change per 100 particles)
EnergyInstructions=5,15,-50;20,40,1400;50,75,-1000;75,95,-400

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
# stepSkip: When saving data only save every Nth
#   time step. This reduces output file size and is usually sufficient for
#   visualisation and analysis. Set to 1 to save every step (not recommended).
# -----------------------------------------------------------------------------
# int
stepSkip=40